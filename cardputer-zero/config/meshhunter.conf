# MeshHunter for CardputerZero: packaged defaults (/etc/meshhunter.conf).
# Changes made in the app are saved to ~/.config/meshhunter/meshhunter.conf,
# which is read after this file and overrides it.

[application]
dark_mode=yes

[radio]
# cap = Cap LoRa-1262 hat, xiao = XIAO nRF52840 sniffer over USB,
# replay = play back a sniffer_packets.jsonl, none = no radio
source=cap
# us (902-928 MHz) or eu868
region=us
# hop = cycle through hop_profiles; fixed = stay on fixed_profile
mode=hop
# Empty = the region's defaults (see the Radio page for the keys).
fixed_profile=
hop_profiles=
spi_device=/dev/spidev0.1
# XIAO sniffer port. auto = the first USB port named "MeshHunter Sniffer".
serial_device=auto
replay_file=
replay_interval_ms=1500

[gps]
enabled=yes
# The Cap LoRa-1262's ATGM336H is on the Pi's primary UART.
device=/dev/ttyS0
baud=115200

[storage]
# Empty = ~/MeshHunter (same layout as the desktop app). Data from older
# versions in ~/.local/share/meshhunter is moved there on first start.
data_dir=
# Append every received packet to sniffer_packets.jsonl.
raw_log=yes

[channels]
# Extra decode keys, comma separated. The default public channels are built in.
# MeshCore: "#hashtag" or "Name=<32 hex chars | base64 key>"
meshcore=
# Meshtastic: "Name=<base64 psk>"
meshtastic=
