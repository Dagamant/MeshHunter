; MeshHunter LoRa sniffer firmware
; Target: Seeed XIAO nRF52840 + Wio-SX1262 (XIAO kit), Adafruit UF2 bootloader
; with SoftDevice S140 7.3.0 (stock Seeed/MeshCore/Meshtastic bootloader).
;
; Build:  ~/.platformio/penv/bin/pio run
; Flash:  ~/.platformio/penv/bin/pio run -t upload --upload-port /dev/ttyACM1
;   or double-tap reset and copy .pio/build/xiao_sx1262/firmware.uf2 to the
;   XIAO-SENSE / XIAO drive that appears.

[env:xiao_sx1262]
platform = nordicnrf52
framework = arduino
board = xiao_nrf52840_raw
board_build.variants_dir = variants
board_build.ldscript = boards/nrf52840_s140_v7.ld
monitor_speed = 115200
build_flags =
  -Wall
  -DRADIOLIB_EXCLUDE_LORAWAN=1
lib_deps =
  jgromes/RadioLib@7.2.1
