name: Release

# Push a tag like v0.1.0 (matching meshhunter/__init__.py, the CardputerZero
# CMake project version and app-builder.json, with a CHANGELOG.md section)
# to build everything and publish a GitHub release with it attached.
# Pull requests that touch release inputs run the same builds without
# publishing, so a broken release build shows up before tagging.

on:
  push:
    tags: ["v*"]
  # Publishing a release in GitHub's web UI (which can create the tag too,
  # e.g. from a phone or tablet) builds and attaches everything as well.
  release:
    types: [published]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/release_info.py
      - CHANGELOG.md
      - pyproject.toml
      - meshhunter/__init__.py
      - cardputer-zero/**
      - firmware/**
  workflow_dispatch:

permissions:
  contents: read

# A UI-created release can fire both the tag push and the release event:
# run them one after the other (the publish step is idempotent).
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Check version and notes
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            version=$(python3 .github/scripts/release_info.py version "$GITHUB_REF")
          else
            version=$(python3 .github/scripts/release_info.py version)
          fi
          python3 .github/scripts/release_info.py notes "$version" > notes.md
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cat notes.md

  python:
    name: Python wheel and sdist
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: python
          path: dist/*
          if-no-files-found: error

  cardputer-zero:
    name: CardputerZero .deb
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cardputer-zero
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends crossbuild-essential-arm64 ninja-build
          pip install "cmake>=3.31"
      - uses: actions/cache@v4
        with:
          # The BSP sysroot and fetched sources (LVGL, fmt) the cross build downloads.
          path: cardputer-zero/.cache
          key: cp0-cache-${{ hashFiles('cardputer-zero/CMakeLists.txt', 'cardputer-zero/cmake/**') }}
      - run: cmake --workflow --preset cp0-cross-package
      - uses: actions/upload-artifact@v4
        with:
          name: cardputer-zero
          path: cardputer-zero/dist/*.deb
          if-no-files-found: error

  firmware:
    name: Sniffer firmware (XIAO nRF52840)
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: firmware/sniffer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('firmware/sniffer/platformio.ini') }}
      - run: pip install platformio
      - run: pio run
      - name: Collect (.hex, DFU .zip, and a .uf2 for drag-and-drop)
        run: |
          # PlatformIO's nRF52 build makes .hex and a DFU .zip but no .uf2;
          # convert the .hex with the uf2conv.py the Adafruit nRF52 core
          # ships. 0xADA52840 is the nRF52840 UF2 family the XIAO's
          # bootloader accepts; the address (0x27000, after S140 7.3.0)
          # comes from the .hex itself.
          uf2conv=$(find ~/.platformio/packages -path '*uf2conv/uf2conv.py' | head -n 1)
          test -n "$uf2conv" || { echo "uf2conv.py not found in the Adafruit nRF52 core"; exit 1; }
          build=.pio/build/xiao_sx1262
          python "$uf2conv" -c -f 0xADA52840 -o "$build/firmware.uf2" "$build/firmware.hex"
          # Sanity check: UF2 magic, nRF52840 family, first block at the app start.
          python - "$build/firmware.uf2" <<'PY'
          import struct, sys
          data = open(sys.argv[1], "rb").read()
          assert data and len(data) % 512 == 0, "not a UF2 file"
          m0, m1, flags, addr, size, block, blocks, family = struct.unpack_from("<8I", data)
          assert (m0, m1) == (0x0A324655, 0x9E5D5157), "bad UF2 magic"
          assert flags & 0x2000 and family == 0xADA52840, f"family {family:#x}"
          assert addr == 0x27000, f"first block at {addr:#x}, expected 0x27000"
          print(f"UF2 ok: {blocks} blocks from {addr:#x}")
          PY
          mkdir -p out
          name="meshhunter-sniffer-xiao-nrf52840-sx1262-${{ needs.version.outputs.version }}"
          for ext in uf2 hex zip; do
            cp "$build/firmware.$ext" "out/$name.$ext"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: firmware/sniffer/out/*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, python, cardputer-zero, firmware]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          python3 .github/scripts/release_info.py notes "$VERSION" > notes.md
          ls -l assets
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            # Created in the web UI: attach the builds, and fill in the
            # title/notes only if they were left empty.
            gh release upload "$tag" assets/* --clobber
            body=$(gh release view "$tag" --json body --jq .body)
            if [ -z "$body" ]; then
              gh release edit "$tag" --title "MeshHunter $VERSION" --notes-file notes.md
            fi
          else
            gh release create "$tag" assets/* \
              --title "MeshHunter $VERSION" --notes-file notes.md --verify-tag
          fi
